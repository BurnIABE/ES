<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Élections sociales CE / CPPT</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2432;--mut:#5c6779;--line:#dbe1e8;--pri:#1d4a73;--pri2:#e9f0f7;--ok:#1b7348;--okb:#e5f3ec;--warn:#8a5a00;--warnb:#fdf3df;--bad:#b42318;--badb:#fdecea;--r:8px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
h2{font-size:19px;margin-bottom:4px}h3{font-size:15px;margin-bottom:10px}h4{font-size:14px;margin:14px 0 6px}
p{margin:0 0 8px}
.mut{color:var(--mut)}.small{font-size:12.5px}
/* Verrou */
#lock{position:fixed;inset:0;background:linear-gradient(160deg,#16395a,#1d4a73 60%,#2b6194);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#lock form{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#lock h1{font-size:18px;margin-bottom:4px}
#lock input{width:100%;margin:16px 0 10px}
#lock .err{color:var(--bad);font-size:13px;min-height:18px}
/* En-tête */
header{background:var(--pri);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header .brand{font-weight:600;font-size:15px;margin-right:auto}
header .brand span{opacity:.75;font-weight:400;font-size:12.5px;display:block}
header .acts{display:flex;gap:6px;flex-wrap:wrap}
header .acts button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
header .acts button:hover{background:rgba(255,255,255,.22)}
#utebar{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.utetab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 16px;cursor:pointer;color:var(--mut);white-space:nowrap;font-weight:500}
.utetab.on{color:var(--pri);border-bottom-color:var(--pri)}
/* Mise en page */
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:20px;max-width:1280px;margin:0 auto}
nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px;align-self:start}
nav button{text-align:left;background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:center}
nav button b{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--mut);font-size:12px;align-items:center;justify-content:center;flex:none}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
nav button.on b{background:var(--pri);color:#fff}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=password],select{border:1px solid #c5ced8;border-radius:6px;padding:7px 9px;background:#fff;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid #9bbbe0;outline-offset:0;border-color:var(--pri)}
input.num{text-align:right}
.hint{font-size:12px;color:var(--mut);font-weight:400}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{margin-top:3px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:#fff;color:var(--pri);border:1px solid #b7c6d6}
.btn.ghost{background:none;color:var(--mut);border:0;padding:4px 8px}
.btn.sm{padding:5px 10px;font-size:13px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#e7ebf0;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.pill{display:inline-block;font-size:11.5px;background:var(--pri2);color:var(--pri);border-radius:10px;padding:1px 7px;margin-left:4px;font-weight:600}
.note{border-radius:6px;padding:9px 12px;font-size:13px;border:1px solid}
.note.info{background:var(--pri2);border-color:#c7d8ea;color:#173d60}
.note.ok{background:var(--okb);border-color:#bfe0cd;color:var(--ok)}
.note.warn{background:var(--warnb);border-color:#f0d9a8;color:var(--warn)}
.note.bad{background:var(--badb);border-color:#f3c5c0;color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge.ok{background:var(--okb);color:var(--ok)}.badge.no{background:#eceff3;color:var(--mut)}.badge.warn{background:var(--warnb);color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f6f8fa;font-weight:600;color:#3a4556;font-size:12.5px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;background:#fafbfc}
td.util{background:var(--okb);color:var(--ok);font-weight:600}
td .rk{font-size:11px;color:var(--ok);margin-left:4px}
.res-eff{color:var(--ok);font-weight:600}.res-sup{color:var(--pri);font-weight:600}
table.edit td{padding:4px 6px}
table.edit input{padding:5px 7px}
.listcard{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.listcard.off{opacity:.55}
.listhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.listhead input[type=text]{max-width:220px;font-weight:600}
.cal td:first-child{font-weight:600;white-space:nowrap}
/* Bulletin */
.ballot{border:2px solid #333;border-radius:4px;background:#fff;padding:12px;overflow-x:auto}
.ballot .bh{text-align:center;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;color:#333}
.bcols{display:flex;gap:0;min-width:min-content}
.bcol{border:1px solid #444;min-width:170px;flex:1}
.bcol+.bcol{border-left:0}
.bcol .bnum{background:#333;color:#fff;text-align:center;font-weight:700;padding:3px}
.bcol .bname{text-align:center;font-weight:700;padding:6px 4px;border-bottom:1px solid #444}
.bcol .btete{display:flex;justify-content:center;padding:8px;border-bottom:1px solid #444}
.bcol ol{list-style:none;margin:0;padding:4px 0}
.bcol li{display:flex;gap:8px;align-items:center;padding:4px 8px}
.case{width:26px;height:26px;border:2px solid #333;border-radius:50%;background:radial-gradient(circle,#fff 30%,#e9e9e9 32%);cursor:pointer;flex:none;padding:0}
.case.sm{width:20px;height:20px}
.case.x{background:radial-gradient(circle,#111 55%,#111 56%)}
.verdict{margin-top:10px}
.journal{max-height:260px;overflow:auto}
.vtag{font-weight:600;font-size:12px;padding:1px 7px;border-radius:8px}
.vtag.tete,.vtag.nomi{background:var(--okb);color:var(--ok)}.vtag.blanc{background:#eceff3;color:var(--mut)}.vtag.nul{background:var(--badb);color:var(--bad)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1b2432;color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:40}
#toast.on{opacity:1}
#print{display:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 20px 24px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:12px 16px}nav{flex-direction:row;overflow-x:auto;position:static}nav button{white-space:nowrap}header{padding:10px 16px}#utebar{padding:0 16px}}
@media print{
 body{background:#fff;font-size:11.5px}
 body>*:not(#print){display:none!important}
 #print{display:block}
 .card{border:0;padding:0;margin-bottom:14px;break-inside:avoid-page}
 th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 td.util{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 h1{font-size:17px;margin-bottom:4px}h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #333;padding-bottom:3px}
 .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
 .sig div{border-top:1px solid #333;padding-top:4px;font-size:11px}
}
</style>

<body>
<div id="lock">
 <form id="lockform" autocomplete="off">
  <h1>Élections sociales — CE / CPPT</h1>
  <p class="mut small">Calcul des mandats, dépouillement et désignation des élus. Accès protégé.</p>
  <input type="password" id="pwd" placeholder="Mot de passe" autofocus>
  <div class="err" id="pwderr"></div>
  <button class="btn" style="width:100%">Ouvrir</button>
 </form>
</div>
<header id="hdr" hidden>
 <div class="brand">Élections sociales — CE / CPPT<span>Règles du SPF Emploi (brochure Élections sociales 2024)</span></div>
 <div class="acts">
  <button data-act="print">Imprimer le PV</button>
  <button data-act="export">Exporter</button>
  <button data-act="import">Importer</button>

 </div>
</header>

<div class="wrap" id="app" hidden><nav id="nav"></nav><main id="main"></main></div>
<footer id="foot" hidden>Outil d’aide au calcul. En cas de doute, seuls les textes légaux et le SPF Emploi font foi.</footer>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
/* ===== Moteur de calcul — règles SPF Emploi, brochure Élections sociales 2024 ===== */
function totalMandats(n){const t=[[100,4],[500,6],[1000,8],[2000,10],[3000,12],[4000,14],[5000,16],[6000,18],[8000,20]];for(const[m,s]of t)if(n<=m)return s;return 22}
/* Répartition des mandats entre catégories (ouvriers / employés / cadres) */
function repartirCategories(cats,M){
 const T=cats.reduce((a,c)=>a+c.n,0),act=cats.filter(c=>c.n>0),r={};cats.forEach(c=>r[c.k]=0);
 if(!T||!M)return r;
 act.forEach(c=>r[c.k]=Math.floor(c.n*M/T));
 let rest=M-act.reduce((a,c)=>a+r[c.k],0);
 const non=act.filter(c=>r[c.k]===0).sort((a,b)=>a.n-b.n);
 if(rest>0)for(const c of non){
  if(rest>0)rest--;
  else{const max=act.filter(x=>!non.includes(x)).sort((a,b)=>r[b.k]-r[a.k]||b.n-a.n)[0];if(!max)break;r[max.k]--}
  r[c.k]=1}
 const dec=c=>Math.floor(((c.n*M)%T)*100/T);
 const ordre=act.filter(c=>!non.includes(c)).sort((a,b)=>dec(b)-dec(a)||b.n-a.n);
 for(let i=0;rest>0&&ordre.length;i++,rest--)r[ordre[i%ordre.length].k]++;
 return r}
/* Dévolution des votes de tête (« pot ») dans l'ordre de présentation */
function distribuer(cands,pot,elig){let p=pot;return cands.map(c=>{const a=Math.max(0,Math.min(elig-c.v,p));p-=a;return{...c,a,t:c.v+a}})}
function choisir(tab,nb,elig){
 const el=tab.filter(c=>c.t>=elig).slice(0,nb);
 if(el.length<nb)el.push(...tab.filter(c=>!el.includes(c)).sort((a,b)=>b.t-a.t||a.i-b.i).slice(0,nb-el.length));
 return el}
/* Désignation des élus effectifs, suppléants et classement des non-élus */
function elus(list,s){
 const valid=list.tete+list.nomi,cands=list.cands.map((c,i)=>({...c,i}));
 const elig=s?Math.round(valid*s/(s+1)):0,pot=list.tete*s;
 if(!s){const tab=cands.map(c=>({...c,a:0,t:c.v}));return{elig,pot,eff:[],sup:[],t2:tab,non:tab.slice().sort((a,b)=>b.t-a.t||a.i-b.i),tab}}
 const tab=distribuer(cands,pot,elig);
 const eff=cands.length<=s?tab.slice():choisir(tab,s,elig);
 const reste=cands.filter(c=>!eff.some(e=>e.i===c.i));
 const t2=distribuer(reste,pot,elig);
 const sup=choisir(t2,Math.min(eff.length,t2.length),elig);
 const non=t2.filter(c=>!sup.includes(c)).sort((a,b)=>b.t-a.t||a.i-b.i);
 return{elig,pot,eff,sup,non,tab,t2}}
/* Répartition des sièges entre listes (chiffre électoral ÷ 1, 2, 3…) */
function repartirSieges(listes,M){
 const L=listes.map((l,i)=>({...l,i,ce:l.tete+l.nomi,s:0})),q=[],alertes=[];
 for(let k=0;k<M;k++){
  const best=L.filter(l=>l.ce>0);if(!best.length)break;
  best.sort((a,b)=>b.ce*(a.s+1)-a.ce*(b.s+1)||b.ce-a.ce);
  let w=best[0];
  const ex=best.filter(l=>l.ce*(w.s+1)===w.ce*(l.s+1)&&l.ce===w.ce);
  if(ex.length>1){
   const info=ex.map(l=>{const e=elus(l,l.s+1),c=e.eff[e.eff.length-1];return{l,t:c?c.t:-1,d:c&&c.date?c.date:'9999-99-99',nom:c?c.nom:''}});
   info.sort((a,b)=>b.t-a.t||a.d.localeCompare(b.d));w=info[0].l;
   alertes.push(`Siège n° ${k+1} : égalité de quotient et de chiffre électoral entre ${ex.map(l=>l.nom).join(' et ')}. Désignation fictive : attribué à ${w.nom} (${info[0].nom}, ${info[0].t} voix${info[0].t===info[1].t?', plus grande ancienneté':''}).`);
   if(info[0].t===info[1].t&&info[0].d===info[1].d)alertes.push('Égalité parfaite : encodez les dates d’entrée en service des candidats concernés pour départager à l’ancienneté.')}
  w.s++;q.push({liste:w.i,quotient:w.ce/w.s,rang:k+1})}
 return{listes:L,quotients:q,alertes}}
/* Validité d'un bulletin */
const ANOM={
 '':['Aucune anomalie',null,''],
 couleur:['Rempli au bic / crayon de couleur',null,' La couleur du bic ou du crayon ne rend pas, à elle seule, le bulletin nul.'],
 maladroit:['Case imparfaitement noircie',null,' Marque maladroite : bulletin valable, sauf s’il est manifeste que l’électeur a voulu se faire reconnaître.'],
 signe:['Signe, rature, inscription ou marque permettant de reconnaître l’électeur','nul',''],
 nonoff:['Bulletin non officiel, forme ou dimensions modifiées, objet joint','nul',''],
 c_tard:['Correspondance : arrivé après la clôture du scrutin','nul',''],
 c_sign:['Correspondance : enveloppe sans signature de l’électeur','nul',''],
 c_deja:['Correspondance : l’électeur est déjà venu voter au bureau','nul',''],
 c_multi:['Correspondance : plusieurs bulletins dans la même enveloppe','nul','']};
function jugerBulletin(b,M){
 const an=ANOM[b.anom||'']||ANOM[''];
 if(an[1]==='nul')return{type:'nul',motif:'Bulletin nul : '+an[0].charAt(0).toLowerCase()+an[0].slice(1)+'.'};
 const note=an[2],ln=b.noms.map((x,i)=>x.length?i:-1).filter(i=>i>=0);
 if(!b.tetes.length&&!ln.length)return{type:'blanc',motif:'Bulletin blanc : aucun suffrage exprimé.'+note};
 if(b.tetes.length>1)return{type:'nul',motif:'Bulletin nul : plus d’un vote en tête de liste.'};
 const listes=new Set([...b.tetes,...ln]);
 if(listes.size>1)return{type:'nul',motif:b.tetes.length?'Bulletin nul : vote en tête d’une liste et vote nominatif sur une autre liste.':'Bulletin nul : panachage (votes nominatifs sur des listes différentes).'};
 const l=[...listes][0];
 if(b.tetes.length)return{type:'tete',liste:l,motif:(ln.length?'Valable : vote en tête de liste + votes nominatifs de la même liste → seul le vote en tête est retenu.':'Valable : vote en tête de liste.')+note};
 if(b.noms[l].length>M)return{type:'tete',liste:l,motif:`Valable : ${b.noms[l].length} votes nominatifs pour ${M} mandats → compté comme vote en tête de liste.`+note};
 return{type:'nomi',liste:l,cands:b.noms[l],motif:`Valable : vote nominatif (${b.noms[l].length} candidat${b.noms[l].length>1?'s':''}).`+note}}


/* ===== Mot de passe (empreinte SHA-256) ===== */
const HASH='f87f7657c398cd4ea376b719bdff128140029243550e7f5a8c2d13465ba5f16b';
function sha256(str){
 const b=Array.from(new TextEncoder().encode(str)),H=[],K=[];let c=0;
 for(let x=2;c<64;x++){let p=true;for(let d=2;d*d<=x;d++)if(x%d===0){p=false;break}
  if(p){if(c<8)H[c]=(Math.pow(x,.5)*4294967296)|0;K[c]=(Math.pow(x,1/3)*4294967296)|0;c++}}
 const L=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);
 for(let i=7;i>=0;i--)b.push(i>3?0:(L>>>(i*8))&255);
 const r=(v,s)=>(v>>>s)|(v<<(32-s));
 for(let o=0;o<b.length;o+=64){
  const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let[a,bb,cc,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
  [a,bb,cc,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0)}
 return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}

/* ===== Outils ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:0};
const f2=x=>x.toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
const pl=(k,s)=>k+' '+s+(k>1?'s':'');
const OUV=[['FGTB'],['CSC'],['SYNOVA']],EMP=[['SETCA'],['CNE'],['SYNOVA']],CAD=[['SETCA',false],['CNE',false],['SYNOVA',false],['CNC'],['Liste de cadres (10 %)',false]];
const CATN={ouv:'Ouvriers',emp:'Employés',cad:'Cadres'};
const ORGN={CE:'Conseil d’entreprise (CE)',CPPT:'Comité pour la prévention et la protection au travail (CPPT)'};
const STEPS=[[1,'Entreprise & seuils'],[2,'Mandats par catégorie'],[3,'Listes & candidats'],[4,'Dépouillement'],[5,'Résultats & élus'],[6,'Règles & sources']];
const KEY='elections_sociales_v1';
function newCat(d){return{inscrits:'',blancs:'',nuls:'',extra:'',lists:d.map(([nom,dep])=>({nom,depose:dep!==false,tete:'',nomi:'',cands:[]})),journal:[]}}
function newUTE(i){return{nom:'UTE '+(i+1),bce:'',adresse:'',dateX:'',moyPerm:'',moyInt:'',ceAvant:false,ouv:'',emp:'',cad:'',dir:'',intX:'',intEleOuv:'',intEleEmp:'',
 CE:{ouv:newCat(OUV),emp:newCat(EMP),cad:newCat(CAD)},CPPT:{ouv:newCat(OUV),emp:newCat(EMP)}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&Array.isArray(x.ute)&&x.ute.length===3?x:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||{active:0,step:1,org:'CE',cat:'ouv',ute:[0,1,2].map(newUTE)};
const U=()=>S.ute[S.active];
function setP(o,p,v){const k=p.split('.'),last=k.pop();k.reduce((a,x)=>a[x],o)[last]=v}

/* ===== Calculs ===== */
function calc(u){
 const ouv=n(u.ouv),emp=n(u.emp),cad=n(u.cad),dir=n(u.dir),intX=n(u.intX),seuil=n(u.moyPerm)+n(u.moyInt);
 const effX=ouv+emp+cad+dir+intX,base=effX>0?totalMandats(effX):0;
 const sep=cad>=15&&(emp+cad+dir)>=30,inc=sep?((cad+dir)<100?1:2):0;
 const mk=(org,cats,legal)=>{const T=cats.reduce((a,b)=>a+b.n,0),dist=repartirCategories(cats,legal),out={};let extra=0;
  cats.forEach(c=>{const e=Math.max(0,Math.round(n(u[org][c.k].extra)));extra+=e;out[c.k]={n:c.n,q:T?c.n*legal/T:0,legal:dist[c.k],extra:e,M:dist[c.k]+e}});
  return{legal,extra,M:legal+extra,T,cats:out,keys:cats.map(c=>c.k),cap:25+(org==='CE'?inc:0)}};
 const CE=mk('CE',sep?[{k:'ouv',n:ouv},{k:'emp',n:emp},{k:'cad',n:cad+dir}]:[{k:'ouv',n:ouv},{k:'emp',n:emp+cad+dir}],base?base+inc:0);
 const CPPT=mk('CPPT',[{k:'ouv',n:ouv},{k:'emp',n:emp+cad+dir}],base);
 return{ouv,emp,cad,dir,intX,seuil,effX,base,sep,inc,CE,CPPT,needCPPT:seuil>=50,needCE:seuil>=100,ceViaCppt:seuil>=50&&seuil<100&&u.ceAvant}}
function inscritsDefaut(u,c,org,k){if(k==='ouv')return c.ouv+n(u.intEleOuv);if(k==='cad')return c.cad;return c.emp+((org==='CPPT'||!c.sep)?c.cad:0)+n(u.intEleEmp)}
const inscrits=(u,c,org,k)=>u[org][k].inscrits!==''?n(u[org][k].inscrits):inscritsDefaut(u,c,org,k);
function resultCat(cd,M){
 const lists=cd.lists.map((l,li)=>({li,nom:l.nom,tete:n(l.tete),nomi:n(l.nomi),depose:l.depose,cands:l.cands.map((c,ci)=>({ci,nom:c.nom,date:c.date||'',v:n(c.v)})).filter(c=>c.nom.trim())})).filter(l=>l.depose&&l.cands.length);
 const valid=lists.reduce((a,l)=>a+l.tete+l.nomi,0),bl=n(cd.blancs),nu=n(cd.nuls),r={M,lists,valid,bl,nu,urne:valid+bl+nu,warn:[],alertes:[]};
 lists.forEach(l=>{const sv=l.cands.reduce((a,c)=>a+c.v,0);
  if(l.cands.length>2*M&&M)r.warn.push(`${l.nom} : ${l.cands.length} candidats pour ${M} mandats (maximum ${2*M} : effectifs + suppléants).`);
  if(sv<l.nomi)r.warn.push(`${l.nom} : ${l.nomi} bulletins nominatifs mais seulement ${sv} voix nominatives (au moins 1 voix par bulletin).`);
  if(M&&sv>l.nomi*M)r.warn.push(`${l.nom} : ${sv} voix nominatives pour ${l.nomi} bulletins nominatifs (maximum ${l.nomi*M}).`)});
 if(!M){r.status='none';return r}
 if(!lists.length){r.status='arret';return r}
 if(lists.length===1&&lists[0].cands.length<=M){r.status='office';return r}
 if(!valid){r.status='wait';return r}
 const rep=repartirSieges(lists,M);r.status='ok';r.quot=rep.quotients;r.alertes=rep.alertes;
 r.res=rep.listes.map(l=>({...l,e:elus(l,l.s),vac:Math.max(0,l.s-l.cands.length)}));
 return r}

/* ===== Calendrier ===== */
const DJ=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function addD(d,k){const x=new Date(d);x.setDate(x.getDate()+k);return x}
function fd(d){return d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fdw(d){return DJ[d.getDay()]+' '+fd(d)}
function qStart(q){return new Date(Math.floor(q/4),(q%4)*3,1)}
function calHTML(u){
 if(!u.dateX)return '<p class="mut small">Encodez le jour X pour afficher le calendrier électoral et les périodes de référence.</p>';
 const X=new Date(u.dateX+'T12:00:00');if(isNaN(X))return '';
 const Y=addD(X,90),qY=Y.getFullYear()*4+Math.floor(Y.getMonth()/3);
 const refA=qStart(qY-6),refB=addD(qStart(qY-2),-1),intA=qStart(qY-4),intB=addD(qStart(qY-3),-1);
 const eA=new Date(X.getFullYear(),X.getMonth()-3,1),eB=new Date(X.getFullYear(),X.getMonth(),0);
 const ev=[[-60,'X − 60','Information écrite : UTE, effectifs par catégorie, fonctions de direction et de cadre'],[-35,'X − 35','Décisions de l’employeur (UTE, direction, cadres)'],[-28,'X − 28','Recours au tribunal du travail'],[0,'X','Affichage de l’avis : date des élections, mandats, listes électorales'],[7,'X + 7','Réclamations contre l’avis'],[35,'X + 35','Dépôt des listes de candidats'],[40,'X + 40','1er affichage des candidats'],[56,'X + 56','2e affichage, accord vote par correspondance'],[77,'X + 77','Clôture définitive des listes de candidats'],[80,'X + 80','Remise des convocations (au plus tard 10 jours avant)'],[90,'Y = X + 90','Jour des élections et dépouillement'],[92,'Y + 2','Affichage des résultats et composition des organes'],[105,'Y + 15','Recours contre les élections']];
 return `<div class="tw"><table class="cal"><tr><th>Étape</th><th>Date</th><th>Opération</th></tr>${ev.map(([k,l,t])=>{const d=addD(X,k),w=d.getDay()===0;return`<tr><td>${l}</td><td>${fdw(d)}${w?' <span class="badge warn">dimanche → la veille</span>':''}</td><td>${t}</td></tr>`}).join('')}</table></div>
 <div class="stack" style="margin-top:12px">
 <div class="note info"><b>Période de référence (seuil, travailleurs) :</b> du ${fd(refA)} au ${fd(refB)} — jours civils ÷ 365.</div>
 <div class="note info"><b>Trimestre de référence des intérimaires (seuil) :</b> du ${fd(intA)} au ${fd(intB)} — jours civils ÷ 92.</div>
 <div class="note info"><b>Droit de vote des intérimaires :</b> au moins 32 jours de travail effectif du ${fd(eA)} au ${fd(eB)}.</div></div>`}

 <p class="small mut" style="margin-top:6px">En vert : quotients utiles, avec le rang d’attribution du siège. À égalité de quotient, le siège va à la liste au chiffre électoral le plus élevé.</p>

 r.res.forEach(l=>{const e=l.e,eff=new Map(e.eff.map((x,i)=>[x.i,i+1])),sup=new Map(e.sup.map((x,i)=>[x.i,i+1])),non=new Map(e.non.map((x,i)=>[x.i,i+1])),t2=new Map(e.t2.map(x=>[x.i,x]));
  e.eff.forEach(x=>compo.push([CATN[k],l.nom,x.nom,'Effectif'])),e.sup.forEach(x=>compo.push([CATN[k],l.nom,x.nom,'Suppléant']));
  h+=`<div class="listcard"><div class="bar" style="justify-content:space-between"><b>${esc(l.nom)} — ${pl(l.s,'siège')}</b><span class="small mut">${l.s?`Chiffre d’éligibilité : (${l.ce} × ${l.s}) ÷ ${l.s+1} = <b>${e.elig}</b> · Votes de tête à répartir : ${l.tete} × ${l.s} = <b>${e.pot}</b>`:'Aucun siège'}</span></div>
  <div class="tw" style="margin-top:8px"><table><tr><th class="n">N°</th><th>Candidat</th><th class="n">Voix nominatives</th><th class="n">+ Votes de tête (1)</th><th class="n">Total (1)</th><th class="n">+ Votes de tête (2)</th><th class="n">Total (2)</th><th>Résultat</th></tr>
  ${e.tab.map(x=>{const y=t2.get(x.i);return`<tr><td class="n">${x.i+1}</td><td>${esc(x.nom)}</td><td class="n">${x.v}</td><td class="n">${l.s&&x.a?x.a:'—'}</td><td class="n">${x.t}</td><td class="n">${y&&y.a&&l.s?y.a:'—'}</td><td class="n">${y?y.t:'—'}</td><td>${eff.has(x.i)?`<span class="res-eff">Effectif ${eff.get(x.i)}</span>`:sup.has(x.i)?`<span class="res-sup">Suppléant ${sup.get(x.i)}</span>`:`Non élu (${non.get(x.i)}e)`}</td></tr>`}).join('')}</table></div>

V[6]=()=>`${head('Règles appliquées & sources','Synthèse des règles du SPF Emploi utilisées par le programme.')}
<section class="card"><h3>Seuils</h3><ul>
<li>CPPT : au moins 50 travailleurs en moyenne ; CE : au moins 100 (ou 50 si un CE existait : pas d’élection, mandats exercés par les élus du CPPT).</li>
<li>Période de référence : 4 trimestres à partir du 1er jour du 6e trimestre avant celui des élections — jours civils ÷ 365 ; moins de 3/4 temps : ÷ 2. Contrats de remplacement exclus.</li>
<li>Intérimaires : comptés chez l’utilisateur pendant le 4e trimestre précédant celui des élections (registre spécial) — jours civils ÷ 92. Ceux qui remplacent un permanent suspendu sont exclus.</li></ul></section>
<section class="card"><h3>Intérimaires</h3><ul>
<li>Nombre de mandats : intérimaires occupés au jour X comptés (sauf remplacement d’un permanent, hors chômage économique / intempéries).</li>
<li>Répartition entre catégories : intérimaires non comptés (Cour de cassation, 15 avril 2013).</li>
<li>Droit de vote : au moins 32 jours de travail effectif pendant les 3 mois civils avant le mois de l’affichage (jour X).</li>
<li>Pas de règle de « 6 mois maximum » : les 6 mois concernent l’ancienneté requise pour être candidat. Un intérimaire ne peut pas être candidat chez l’utilisateur.</li></ul></section>
<section class="card"><h3>Mandats</h3><ul>
<li>Barème : moins de 101 → 4 · 101–500 → 6 · 501–1000 → 8 · 1001–2000 → 10 · 2001–3000 → 12 · 3001–4000 → 14 · 4001–5000 → 16 · 5001–6000 → 18 · 6001–8000 → 20 · plus de 8000 → 22 ; autant de suppléants. Le personnel de direction sous contrat est ajouté à l’effectif.</li>
<li>Cadres (CE uniquement) : représentation séparée à partir de 15 cadres (au moins 30 employés) ; +1 mandat si cadres + direction &lt; 100, +2 sinon. Direction comptée avec les cadres (ou les employés sans représentation séparée).</li>
<li>Répartition proportionnelle ; mandat restant à une catégorie non représentée, puis aux décimales les plus élevées, puis à l’effectif le plus grand.</li>
<li>Pas de mandats « jeunes travailleurs » dans ce programme (choix de configuration) : à vérifier si l’UTE compte au moins 25 travailleurs de moins de 25 ans.</li></ul></section>
<section class="card"><h3>Vote et dépouillement</h3><ul>
<li>Vote en tête de liste (accord avec l’ordre de présentation) ou votes nominatifs pour un ou plusieurs candidats d’une même liste.</li>
<li>Tête de liste + noms de la même liste : seul le vote de tête compte. Plus de votes nominatifs que de mandats : vote de tête.</li>
<li>Nuls : plusieurs votes en tête, panachage entre listes, tête d’une liste + nom d’une autre, bulletin non officiel ou modifié, marque permettant d’identifier l’électeur ; en correspondance : arrivé tard, sans signature, électeur déjà venu, plusieurs bulletins.</li>
<li>La couleur du bic ou du crayon ne rend pas, à elle seule, un bulletin nul ; une case mal noircie non plus, sauf volonté manifeste de se faire reconnaître.</li>
<li>Blanc : aucun suffrage exprimé.</li></ul></section>
<section class="card"><h3>Sièges et élus</h3><ul>
<li>Chiffre électoral = votes en tête + bulletins nominatifs. Division par 1, 2, 3… ; à égalité de quotient : chiffre électoral le plus élevé, puis désignation fictive, puis ancienneté.</li>
<li>Chiffre d’éligibilité = (bulletins valables × sièges) ÷ (sièges + 1), arrondi (décimale ≥ 5 vers le haut).</li>
<li>Votes de tête × sièges répartis dans l’ordre de présentation jusqu’au chiffre d’éligibilité ; sièges restants aux candidats ayant le plus de voix ; à égalité, ordre de présentation.</li>
<li>Suppléants : nouvelle dévolution en partant du premier non élu, au plus autant que d’effectifs. Une liste qui a plus de sièges que de candidats laisse des sièges vacants.</li></ul></section>
<section class="card"><h3>Sources officielles</h3><ul>
<li><a href="https://emploi.belgique.be/sites/default/files/content/documents/Concertation%20sociale/ElectionsSociales2024_Brochure_explicative.pdf" target="_blank" rel="noopener">SPF Emploi — Élections sociales 2024 : brochure explicative (PDF)</a></li>
<li><a href="https://emploi.belgique.be" target="_blank" rel="noopener">emploi.belgique.be — Concertation sociale, Élections sociales</a></li></ul>
<p class="small mut">Les élections sociales relèvent du droit fédéral : les règles sont identiques en Région wallonne. Organisations représentatives : FGTB (SETCA), CSC (CNE), SYNOVA (ex-CGSLB) ; cadres : CNC.</p></section>`;
